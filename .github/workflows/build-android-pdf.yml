name: Build IN THE VOID APK - Canonical PDF

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Firebase Android config
        run: test -s google-services.json
      - name: Prepare web bundle
        run: npm run build:web
      - name: Add Android project
        run: npx cap add android
      - name: Generate launcher and splash assets
        run: npx capacitor-assets generate --android
      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail
          RUN_VERSION_CODE=$((GITHUB_RUN_NUMBER + 40))
          echo "ANDROID_VERSION_CODE=$RUN_VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.3.0" >> "$GITHUB_ENV"
      - name: Apply Android project fixes
        run: node scripts/prepare-android.mjs
      - name: Apply canonical PDF architecture
        run: node scripts/patch-pdf-canonical.mjs
      - name: Fix generated PDF Java string escapes
        run: node scripts/fix-pdf-java-escapes.mjs
      - name: Patch Capacitor MainActivity system bars and plugin registration
        run: node scripts/patch-main-activity.mjs
      - name: Validate patch scripts
        run: |
          set -euo pipefail
          node --check scripts/prepare-android.mjs
          node --check scripts/patch-pdf-canonical.mjs
          node --check scripts/fix-pdf-java-escapes.mjs
          node --check scripts/patch-main-activity.mjs
      - name: Preflight canonical PDF path
        shell: bash
        run: |
          set -euo pipefail
          PDF_JAVA="android/app/src/main/java/com/inthevoid/platform/PdfViewerActivity.java"
          PLUGIN_JAVA="android/app/src/main/java/com/inthevoid/platform/PdfViewerPlugin.java"
          MAIN_JAVA="android/app/src/main/java/com/inthevoid/platform/MainActivity.java"
          HTML="www/app/index.html"
          GRADLE="android/app/build.gradle"
          ROOT_GRADLE="android/build.gradle"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -s "$PDF_JAVA"
          test -s "$PLUGIN_JAVA"
          test -s "$MAIN_JAVA"
          test -s "$HTML"
          test -s "$GRADLE"
          test -s "$ROOT_GRADLE"
          test -s "$MANIFEST"

          echo '--- Active PDF routing in generated web bundle ---'
          grep -nE 'downloadMaterial|PdfViewer\.openUrl|fileName: \(m\.file_path|iv-native-pdf-runtime' "$HTML" | head -80 || true
          echo '--- Active native PDF bridge markers ---'
          grep -nE 'openUrl\(PluginCall|downloadAndValidatePdf|containsPdfHeader|containsPdfEof|NotPdfException' "$PLUGIN_JAVA" | head -80 || true
          echo '--- Active AndroidX PDF viewer markers ---'
          grep -nE 'PdfViewerFragment|PdfView|setPagesPerRow|setVerticalPageSpacing|setMaxZoom|onLoadDocumentSuccess|onLoadDocumentError' "$PDF_JAVA" | head -100 || true

          require() {
            local pattern="$1" file="$2" label="$3"
            if grep -Fq "$pattern" "$file"; then
              echo "PASS: $label"
            else
              echo "FAIL: $label"
              exit 1
            fi
          }

          require 'implementation "androidx.pdf:pdf-viewer-fragment:1.0.0-beta01"' "$GRADLE" 'official AndroidX PDF viewer dependency'
          require 'compileSdk = 36' "$GRADLE" 'AndroidX PDF compile SDK'
          require 'compileSdkExtension = 19' "$GRADLE" 'AndroidX PDF SDK extension 19'
          require 'minSdkVersion 28' "$GRADLE" 'AndroidX PDF minimum SDK'
          require 'com.android.tools.build:gradle:8.9.1' "$ROOT_GRADLE" 'Android Gradle plugin 8.9.1+'
          require 'public void openUrl(PluginCall call)' "$PLUGIN_JAVA" 'native URL bridge'
          require 'downloadAndValidatePdf' "$PLUGIN_JAVA" 'complete PDF download pipeline'
          require 'containsPdfHeader' "$PLUGIN_JAVA" 'PDF signature validation'
          require 'containsPdfEof' "$PLUGIN_JAVA" 'PDF EOF validation'
          require 'private static class NotPdfException' "$PLUGIN_JAVA" 'non-PDF rejection'
          require 'extends AppCompatActivity' "$PDF_JAVA" 'dedicated PDF activity'
          require 'PdfViewerFragment' "$PDF_JAVA" 'official PDF fragment'
          require 'setPagesPerRow(1)' "$PDF_JAVA" 'one page per row'
          require 'setVerticalAlignment(PdfView.VERTICAL_ALIGNMENT_TOP)' "$PDF_JAVA" 'top-aligned vertical document'
          require 'setVerticalPageSpacing' "$PDF_JAVA" 'vertical page spacing'
          require 'setMaxZoom(5f)' "$PDF_JAVA" 'PDF zoom limit'
          require 'onLoadDocumentSuccess' "$PDF_JAVA" 'successful document callback'
          require 'onLoadDocumentError' "$PDF_JAVA" 'real PDF error callback'
          require 'setToolboxVisible(false)' "$PDF_JAVA" 'viewer-only toolbar surface'
          require 'PdfViewerPlugin' "$MAIN_JAVA" 'plugin registration'
          require 'registerPlugin' "$MAIN_JAVA" 'native plugin registration call'
          require 'PdfViewer.openUrl' "$HTML" 'canonical web-to-native PDF call'
          require 'fileName: (m.file_path ?' "$HTML" 'real storage filename retained for PDF routing'
          require 'errorView.setText("تعذر عرض ملف PDF\\n\\n" + message' "$PDF_JAVA" 'Java escaped PDF error text'

          if grep -Fq 'iv-native-pdf-runtime' "$HTML"; then
            echo 'FAIL: legacy web PDF runtime marker still exists'
            exit 1
          fi
          if grep -Fq 'android.graphics.pdf.PdfRenderer' "$PLUGIN_JAVA"; then
            echo 'FAIL: legacy PdfRenderer plugin still exists'
            exit 1
          fi
          if grep -Fq 'android.graphics.pdf.PdfRenderer' "$PDF_JAVA"; then
            echo 'FAIL: legacy custom PdfRenderer viewer still exists'
            exit 1
          fi
          if grep -Fq 'private class PdfPageView' "$PDF_JAVA"; then
            echo 'FAIL: legacy single-page custom viewer still exists'
            exit 1
          fi
          if grep -Fq 'goToPage(' "$PDF_JAVA"; then
            echo 'FAIL: legacy page-slider navigation still exists'
            exit 1
          fi
          if grep -Fq 'onFling(' "$PDF_JAVA"; then
            echo 'FAIL: legacy horizontal fling navigation still exists'
            exit 1
          fi
          echo 'PASS: one canonical Android PDF viewer path; no legacy custom renderer.'
      - name: Sync Capacitor and reapply native patches
        run: |
          set -euo pipefail
          npx cap sync android
          node scripts/prepare-android.mjs
          node scripts/patch-pdf-canonical.mjs
          node scripts/fix-pdf-java-escapes.mjs
          node scripts/patch-main-activity.mjs
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-36-ext19
      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/in_the_void_release.jks
          chmod 600 android/in_the_void_release.jks
          test -s android/in_the_void_release.jks
      - name: Build signed Release APK
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/in_the_void_release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon

          RELEASE_DIR="app/build/outputs/apk/release"
          UNSIGNED="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*unsigned*.apk' | head -1 || true)"
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED="$RELEASE_DIR/app-release.apk"
          fi
          test -s "$UNSIGNED"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          ALIGNED="$RELEASE_DIR/app-release-aligned.apk"
          FINAL="$RELEASE_DIR/app-release.apk"
          "$ZIPALIGN" -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --out "$FINAL" \
            "$ALIGNED"
          rm -f "$ALIGNED"
          if [ "$UNSIGNED" != "$FINAL" ]; then rm -f "$UNSIGNED"; fi
          test -s "$FINAL"
      - name: Verify APK identity, version and release signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep '^package:' | head -1)"
          case "$PACKAGE_LINE" in *"name='com.inthevoid.platform'"*) : ;; *) exit 1 ;; esac
          case "$PACKAGE_LINE" in *"versionCode='$ANDROID_VERSION_CODE'"*) : ;; *) exit 1 ;; esac
          case "$PACKAGE_LINE" in *"versionName='1.3.0'"*) : ;; *) exit 1 ;; esac
          SIGNATURE_INFO="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          ACTUAL_SHA256="$(printf '%s\n' "$SIGNATURE_INFO" | grep -Eio '([0-9a-f]{2}:){31}[0-9a-f]{2}' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]' || true)"
          if ! printf '%s' "$ACTUAL_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            ACTUAL_SHA256="$(printf '%s\n' "$SIGNATURE_INFO" | grep -Eio '[0-9a-f]{64}' | head -1 | tr '[:upper:]' '[:lower:]' || true)"
          fi
          test "$ACTUAL_SHA256" = "3e5872aafa51b9968b5a31112c043ef702eac385c32d1a5409f44bc79e967d15"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IN_THE_VOID-APK-Canonical-PDF-v4
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f android/in_the_void_release.jks
