name: Build IN THE VOID APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prepare web bundle (offline-capable)
        run: npm run build:web

      - name: Add Android project
        run: npx cap add android

      - name: Generate launcher and splash assets
        run: npx capacitor-assets generate --android

      - name: Set release version
        run: |
          # Current installed APK uses versionCode 5.
          # This repository is already at run 6+,
          # so GITHUB_RUN_NUMBER + 2 stays above the old version.
          echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 2))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.2.0" >> "$GITHUB_ENV"

      - name: Apply IN THE VOID Android fixes
        run: node scripts/prepare-android.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "Missing ANDROID_KEYSTORE_BASE64"
            exit 1
          }

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "Missing ANDROID_KEYSTORE_PASSWORD"
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "Missing ANDROID_KEY_ALIAS"
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "Missing ANDROID_KEY_PASSWORD"
            exit 1
          }

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/in_the_void_release.jks

          chmod 600 android/in_the_void_release.jks

          test -s android/in_the_void_release.jks

      - name: Build signed Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/in_the_void_release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK identity, version and release signature
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          EXPECTED_PACKAGE="com.inthevoid.platform"
          EXPECTED_VERSION_CODE=$((GITHUB_RUN_NUMBER + 2))
          EXPECTED_VERSION_NAME="1.2.0"
          EXPECTED_SHA256="3e5872aafa51b9968b5a31112c043ef702eac3c385c32d1a5409f44bc79e967d15"

          echo "========================================"
          echo "Checking APK file"
          echo "========================================"

          test -f "$APK"
          test -s "$APK"

          echo "APK found:"
          ls -lh "$APK"

          echo
          echo "========================================"
          echo "Finding Android build tools"
          echo "========================================"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"

          test -n "$AAPT"
          test -n "$APKSIGNER"

          echo "AAPT: $AAPT"
          echo "APKSIGNER: $APKSIGNER"

          echo
          echo "========================================"
          echo "Reading APK manifest information"
          echo "========================================"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING"

          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep '^package:' | head -1)"

          test -n "$PACKAGE_LINE"

          echo
          echo "Package line:"
          echo "$PACKAGE_LINE"

          echo
          echo "========================================"
          echo "Checking package"
          echo "========================================"

          if [[ "$PACKAGE_LINE" != *"name='$EXPECTED_PACKAGE'"* ]]; then
            echo "ERROR: Package name does not match."
            echo "Expected: $EXPECTED_PACKAGE"
            exit 1
          fi

          echo "Package OK: $EXPECTED_PACKAGE"

          echo
          echo "========================================"
          echo "Checking versionCode"
          echo "========================================"

          if [[ "$PACKAGE_LINE" != *"versionCode='$EXPECTED_VERSION_CODE'"* ]]; then
            echo "ERROR: versionCode does not match."
            echo "Expected: $EXPECTED_VERSION_CODE"
            exit 1
          fi

          echo "versionCode OK: $EXPECTED_VERSION_CODE"

          echo
          echo "========================================"
          echo "Checking versionName"
          echo "========================================"

          if [[ "$PACKAGE_LINE" != *"versionName='$EXPECTED_VERSION_NAME'"* ]]; then
            echo "ERROR: versionName does not match."
            echo "Expected: $EXPECTED_VERSION_NAME"
            exit 1
          fi

          echo "versionName OK: $EXPECTED_VERSION_NAME"

          echo
          echo "========================================"
          echo "Checking APK signature"
          echo "========================================"

          SIGNATURE_INFO="$("$APKSIGNER" verify --print-certs "$APK")"

          echo "$SIGNATURE_INFO"

          ACTUAL_SHA256="$(
            printf '%s\n' "$SIGNATURE_INFO" |
            awk -F': ' '/certificate SHA-256 digest:/ {
              print $2
              exit
            }'
          )"

          test -n "$ACTUAL_SHA256"

          ACTUAL_SHA256="$(
            printf '%s' "$ACTUAL_SHA256" |
            tr -d ':' |
            tr '[:upper:]' '[:lower:]'
          )"

          echo
          echo "Expected SHA-256:"
          echo "$EXPECTED_SHA256"

          echo
          echo "Actual SHA-256:"
          echo "$ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo
            echo "ERROR: Release signing certificate does not match."
            exit 1
          fi

          echo
          echo "Certificate OK."

          echo
          echo "========================================"
          echo "Running final apksigner verification"
          echo "========================================"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo
          echo "========================================"
          echo "ALL APK CHECKS PASSED"
          echo "========================================"
          echo "Package:      $EXPECTED_PACKAGE"
          echo "Version Code: $EXPECTED_VERSION_CODE"
          echo "Version Name: $EXPECTED_VERSION_NAME"
          echo "Certificate:  $EXPECTED_SHA256"
          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IN_THE_VOID-APK-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove temporary signing keystore
        if: always()
        run: |
          rm -f android/in_the_void_release.jks
